<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aventura da Tabuada</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16224a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabuada">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--fundo:#16224a;--verm:#d62839;--vermesc:#9b1625;--tela:#e3f4e8;--tinta:#16224a;--amar:#ffcb05;--card:#22346b}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:#fff;font-family:Nunito,system-ui,sans-serif;padding:14px 12px 90px}
#app{max-width:640px;margin:0 auto}
h1,h2,.nome,.conta,.fogo b{font-family:'Baloo 2',sans-serif}
h2{margin:22px 0 8px;font-size:1.25rem}
button,select,input{font:inherit;border:0;border-radius:10px;padding:12px 14px}
button{background:var(--amar);color:var(--tinta);font-weight:700;cursor:pointer}
button.sec{background:var(--card);color:#fff;margin-top:12px}
button.grande{width:100%;margin-top:12px;font-size:1.1rem;background:var(--verm);color:#fff;border-bottom:4px solid var(--vermesc)}
button.mini{padding:4px 8px;font-size:.75rem;margin-top:4px}
button.lin{background:var(--card);color:#fff;margin:3px;padding:8px 12px}
select,input{width:100%;margin:6px 0;background:#fff;color:var(--tinta)}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fogo{display:flex;align-items:baseline;gap:6px;font-size:2rem;filter:grayscale(1) opacity(.55)}
.fogo.on{filter:none}.fogo b{font-size:2.2rem;color:var(--amar)}.fogo small{font-size:.9rem;color:#fff}
.moedas{background:var(--card);padding:8px 14px;border-radius:99px;font-weight:700}
.tela{background:var(--tela);color:var(--tinta);border-radius:16px;border:5px solid #0c1433;padding:16px;text-align:center}
.tela .grande{margin-top:10px}
.pet{background:none;padding:0}.pet img{width:210px;height:210px;object-fit:contain}
.pulo img{animation:pulo .5s}
@keyframes pulo{40%{transform:translateY(-18px) scale(1.05)}}
.nome{font-weight:800;font-size:1.7rem;text-transform:capitalize}
.info{background:var(--verm);border-radius:14px;padding:12px 14px;margin-top:12px;border-bottom:5px solid var(--vermesc)}
.info p{margin:4px 0}
.barra{height:10px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--amar);transition:width .3s}
.aviso{background:var(--card);padding:10px 12px;border-radius:12px}
.topq{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.conta{font-size:3.4rem;font-weight:800}
.erro{background:#fff3cd;border-radius:10px;padding:8px;color:#5a4300}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{background:var(--card);border-radius:12px;padding:8px;text-align:center}
.card img{width:100%;height:110px;object-fit:contain}
.card.bloq img{filter:brightness(0);opacity:.45}
.card span{display:block;font-weight:700;text-transform:capitalize}
.arr{display:grid;gap:4px;margin:8px 0}.arr i{width:16px;height:16px;border-radius:50%;background:var(--amar)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0c1433;padding:8px;gap:6px;justify-content:center}
nav button{background:none;color:#fff;flex:1;max-width:150px}nav button.on{background:var(--verm)}
label{display:block;margin-top:8px;font-weight:700}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--amar);color:var(--tinta);padding:10px 16px;border-radius:99px;font-weight:700;z-index:20}
.tipo{display:inline-block;background:var(--tinta);color:#fff;border-radius:99px;padding:2px 12px;margin:2px;font-size:.9rem}
.ov{position:fixed;inset:0;background:radial-gradient(#22346b,#0c1433);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
.balls{display:flex;gap:10px}
.ball{width:54px;height:54px;position:relative;animation:mix 1.1s ease-in-out}
.ball i{position:absolute;left:0;width:100%;height:50%;border:3px solid #222;box-sizing:border-box}
.ball .t{top:0;background:#d62839;border-radius:54px 54px 0 0;transform-origin:left bottom;transition:transform .6s}
.ball .b{bottom:0;background:#fff;border-radius:0 0 54px 54px}
.ball.abre{box-shadow:0 0 50px 26px #fff;border-radius:50%}
.ball.abre .t{transform:translateY(-14px) rotate(-40deg)}
.ball::after{content:"";position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px;background:#fff;border:3px solid #222;border-radius:50%;z-index:2}
.ball.fora{opacity:0;transform:scale(.4);transition:.6s}
.ball.bal{animation:bal .5s ease-in-out 3}
@keyframes mix{25%{transform:translateY(-20px) rotate(-12deg)}75%{transform:translateY(14px) rotate(12deg)}}
@keyframes bal{25%{transform:rotate(-22deg)}75%{transform:rotate(22deg)}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;animation:fl .8s;pointer-events:none}
@keyframes fl{30%{opacity:1}}
.reveal img{width:240px;animation:surge .6s}
@keyframes surge{from{transform:scale(.2);opacity:0}}
@keyframes brilho{50%{filter:brightness(0) invert(1) drop-shadow(0 0 30px #ffcb05);transform:scale(1.15)}}
nav button{padding:10px 2px;font-size:.78rem}button:disabled{opacity:.45;cursor:default}
.cena{position:relative;display:inline-block}.cena img{width:200px;height:200px;object-fit:contain}
.acc{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:2.4rem}.deco{font-size:2rem;min-height:2.4rem}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px;margin:6px 0}.item b{flex:1}
.bal{display:flex;align-items:center;gap:10px;margin:10px 0}.pq{flex:none}.pq img{width:76px;height:76px;object-fit:contain}
.fala{background:#fff;color:var(--tinta);border-radius:14px;padding:8px 12px;font-weight:700;flex:1}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.op{background:var(--verm);color:#fff;font-family:'Baloo 2',sans-serif;font-size:1.7rem;border-bottom:4px solid var(--vermesc);padding:14px}
.op:disabled{opacity:.35}.dica{background:#fff3cd;color:#5a4300;border-radius:10px;padding:8px;margin:8px 0 0}
.flutua{position:fixed;top:38%;left:50%;transform:translateX(-50%);font:800 2rem 'Baloo 2',sans-serif;color:var(--amar);text-shadow:0 2px 0 #000;z-index:15;pointer-events:none;animation:sobe 1s forwards}
@keyframes sobe{to{opacity:0;transform:translate(-50%,-70px)}}
.cena2{position:relative;height:290px;border-radius:12px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;border:3px solid #0c1433}
.cena2 .cena img{width:190px;height:190px}.dec{position:absolute;line-height:1}
.stat{display:grid;grid-template-columns:110px 1fr 74px;gap:8px;align-items:center;font-size:.85rem;margin:5px 0}
.reduzir *{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}
</style>
</head>
<body>
<div id="app"></div>
<nav>
  <button data-t="inicio" onclick="ir('inicio')">Início</button>
  <button data-t="estudar" onclick="ir('estudar')">Estudar</button>
  <button data-t="cuidar" onclick="ir('cuidar')">Cuidar</button>
  <button data-t="loja" onclick="ir('loja')">Loja</button>
  <button data-t="dex" onclick="ir('dex')">Pokédex</button>
  <button data-t="prof" onclick="ir('prof')">Prof.</button>
</nav>

<script>
const $=s=>document.querySelector(s), app=$("#app");
const IMG=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
const POOL={comum:[10,13,16,19,21,41,43,46,52,54,60,66,72,74,79,92,96,116,129,161],
  raro:[1,4,7,25,37,39,58,63,133,143,147,152,155,158],lendario:[144,145,146,150,243,244,245]};
const ALL=[...POOL.comum,...POOL.raro,...POOL.lendario], INICIAIS=[1,4,7,25,133,152,155,158,252,255,258,387,390,393,495,498,501,650,653,656,722,725,728,810,813,816,906,909,912];
const TP={normal:"Normal",fire:"Fogo",water:"Água",electric:"Elétrico",grass:"Planta",ice:"Gelo",fighting:"Lutador",poison:"Veneno",ground:"Terra",flying:"Voador",psychic:"Psíquico",bug:"Inseto",rock:"Pedra",ghost:"Fantasma",dragon:"Dragão",dark:"Sombrio",steel:"Aço",fairy:"Fada"};
const DICAS={2:"É o dobro: 2 × 6 é 6 + 6.",3:"É o dobro mais mais um grupo: 3 × 7 = 14 + 7.",4:"É o dobro do dobro.",5:"Termina em 0 ou 5. É metade da tabuada do 10.",6:"Use a do 5 e some mais um grupo: 6 × 7 = 35 + 7.",7:"Decore: 7 × 8 = 56 (5, 6, 7, 8).",8:"É o dobro do dobro do dobro.",9:"Os algarismos do resultado somam 9: 9 × 7 = 63 (6 + 3).",10:"É só acrescentar um zero.",11:"Até 11 × 9 o algarismo se repete: 11 × 4 = 44.",12:"Use a do 10 e some o dobro: 12 × 4 = 40 + 8."};
const KEY="tabuada-pokemon-v1";
const PADRAO={cfg:{tempo:60,meta:10,max:10,teto:40,tetoXP:30,moedaAcerto:2,bonusMeta:15,bonusDiario:20,bonusRepet:25,capDia:2,capSemana:7,dificuldade:"medio",som:true,lembrete:false,hora:"17:00",reduzir:false,tz:(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch{return "America/Fortaleza"}})()},
  coins:0,streak:0,last:null,inicio:null,legFor:null,pendLeg:false,perdeu:false,feitas:{dia:null,n:0},coinsHoje:{dia:null,n:0},caught:{},comp:null,stats:{},hist:{},inv:{},acc:null,uso:{},cap:{dia:null,n:0,tab:{}}};
let S;
try{const j=JSON.parse(localStorage.getItem(KEY));S=j?{...PADRAO,...j,cfg:{...PADRAO.cfg,...j.cfg}}:JSON.parse(JSON.stringify(PADRAO))}catch{S=JSON.parse(JSON.stringify(PADRAO))}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
let tela="inicio",Q=null;

function hoje(){try{return new Date().toLocaleDateString("sv-SE",{timeZone:S.cfg.tz})}catch{return new Date().toLocaleDateString("sv-SE")}}
const dif=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
if(S.last&&dif(S.last,hoje())>1){if(S.streak>0)S.perdeu=true;S.streak=0;save()}
const feitasHoje=()=>S.feitas.dia===hoje()?S.feitas.n:0;
function toast(t){const d=document.createElement("div");d.className="toast";d.style.top=14+document.querySelectorAll(".toast").length*48+"px";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3500)}
function ganhar(n){const h=hoje();if(S.coinsHoje.dia!==h)S.coinsHoje={dia:h,n:0};const g=Math.max(0,Math.min(n,S.cfg.teto-S.coinsHoje.n));S.coins+=g;S.coinsHoje.n+=g;return g}
async function dados(id){try{const j=await(await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`)).json();return{nome:j.name[0].toUpperCase()+j.name.slice(1),tipos:j.types.map(t=>TP[t.type.name]||t.type.name)}}catch{return{nome:"Pokémon #"+id,tipos:[]}}}
const embaralhar=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- navegação ---------- */
function ir(v){if(Q){clearInterval(Q.timer);Q=null}if(v!=="prof")profOk=false;tela=v;render()}
function render(){
  app.innerHTML=({inicio,estudar,cuidar,loja,dex,prof}[tela])();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tela));
  document.body.classList.toggle("reduzir",!!S.cfg.reduzir||sysReduz);
  if(tela==="estudar")aprender();
  if(tela==="inicio"){entregas();garantirEvo()}
}

/* ---------- início ---------- */
function inicio(){
  if(!S.comp)return `<h2>Escolha seu primeiro companheiro</h2><div class="grade">${INICIAIS.map(i=>`<div class="card"><img src="${IMG(i)}" alt=""><button class="mini" onclick="escolher(${i})">Escolher</button></div>`).join("")}</div>`;
  const aceso=S.last===hoje(),n=Math.min(feitasHoje(),S.cfg.meta);
  return `<div class="topo"><div class="fogo ${aceso?"on":""}">🔥<b>${S.streak}</b><small>${S.streak===1?"dia":"dias"}</small></div><div class="moedas">🪙 ${S.coins}</div></div>
  ${S.perdeu&&!aceso?`<p class="aviso">Vamos recomeçar? Cada dia novo é uma chance de acender o foguinho de novo. Seus Pokémon e moedas continuam todos aqui.</p>`:""}
  <div class="tela"><button class="pet" id="pet" onclick="carinho()"><img src="${IMG(S.comp)}" alt="Seu companheiro"></button>
  <div class="nome">${S.caught[S.comp]?.nome||""}</div><div id="fala">${aceso?"Foguinho aceso! Você está arrasando.":"Seu companheiro está pronto para mais uma aventura de tabuada!"}</div></div>
  <div class="info"><p><b>Meta de hoje:</b> ${n} de ${S.cfg.meta} contas</p><div class="barra"><i style="width:${n/S.cfg.meta*100}%"></i></div></div>
  <div class="info">${painelXP()}</div>${S.diario===hoje()?`<p class="aviso">Desafio diário concluído hoje ✔ Volte amanhã!</p>`:`<button class="grande" onclick="iniciar('diario',0)">Desafio diário (XP extra)</button>`}<button class="grande" onclick="ir('estudar')">Estudar agora</button><p style="opacity:.7;font-size:.8rem;text-align:center">💾 O progresso fica salvo neste aparelho.</p>`;
}
async function escolher(id){const d=await dados(id);S.caught[id]={nome:d.nome,n:1,nivel:1,xp:0,rar:"raro"};S.comp=id;save();render()}
function comp(id){S.comp=id;save();ir("inicio")}
function carinho(){$("#pet").classList.remove("pulo");void $("#pet").offsetWidth;$("#pet").classList.add("pulo");$("#fala").textContent=agrado()}

/* ---------- estudar ---------- */
function estudar(){
  const o=Array.from({length:S.cfg.max},(_,i)=>`<option value="${i+1}">Tabuada do ${i+1}</option>`).join("");
  return `<h2>Aprender</h2><div class="info"><select id="ta" onchange="aprender()">${o}</select><div id="apr"></div></div>
  <h2>Treinar, sem pressa</h2><div class="info"><select id="tt"><option value="0">Mistura (mais as contas difíceis)</option>${o}</select><button class="sec" onclick="iniciar('treino',+$('#tt').value)">Começar treino</button></div>
  <h2>Desafio de captura</h2><div class="info"><p>Acerte a tabuada toda em ${S.cfg.tempo} segundos, sem errar, e capture um Pokémon.</p><select id="td">${o}</select><button class="sec" onclick="iniciar('desafio',+$('#td').value)">Aceitar desafio</button></div>`;
}
function aprender(){const a=+$("#ta").value;$("#apr").innerHTML=`<p>${DICAS[a]||"A tabuada do 1 é o próprio número."}</p>`+Array.from({length:10},(_,i)=>`<button class="lin" onclick="arr(${a},${i+1})">${a} × ${i+1} = ${a*(i+1)}</button>`).join("")+`<div id="arr"></div>`}
function arr(a,b){$("#arr").innerHTML=`<p>${b} linhas de ${a} bolinhas = ${a*b}</p><div class="arr" style="grid-template-columns:repeat(${a},16px)">${"<i></i>".repeat(a*b)}</div>`}

/* ---------- perguntas ---------- */
const chave=(a,b)=>a+"x"+b;
function reg(a,b,ok){const k=chave(Math.min(a,b),Math.max(a,b)),s=S.stats[k]||(S.stats[k]={ok:0,err:0});ok?s.ok++:s.err++;const h=hoje(),d=(S.hist2=S.hist2||{})[h]||(S.hist2[h]={ok:0,err:0});ok?d.ok++:d.err++}
function iniciar(modo,t){
  let f=[];
  if(modo==="diario")f=montarDiario();else if(t){for(let b=1;b<=10;b++)f.push([t,b])}
  else{for(let a=2;a<=S.cfg.max;a++)for(let b=1;b<=10;b++)f.push([a,b]);
    f=f.map(x=>[x,Math.random()*(1+(S.stats[chave(Math.min(...x),Math.max(...x))]?.err||0)*3)]).sort((p,q)=>q[1]-p[1]).slice(0,10).map(x=>x[0])}
  f=embaralhar(f).map(([a,b])=>Math.random()<.5?[a,b]:[b,a]);
  Q={modo,t,f,i:0,tent:0,certas:0,ganho:0,fim:Date.now()+S.cfg.tempo*1000};
  if(modo==="desafio")Q.timer=setInterval(tick,250);
  perguntar();
}
function tick(){if(!Q)return;const r=Math.ceil((Q.fim-Date.now())/1000),e=$("#tm");if(e)e.textContent="⏱ "+Math.max(r,0)+"s";if(r<=0)fim(false,"O tempo acabou! Respire fundo e tente de novo.")}
let balao="Vamos lá! Eu torço por você.",pulaPet=false;
const pick=l=>l[Math.floor(Math.random()*l.length)];
function efeito(t){const d=document.createElement("div");d.className="flutua";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1000)}
function acertoMsg(){
  Q.seq=Q.tent===0?(Q.seq||0)+1:0;
  if(Q.seq>=3&&Q.seq%3===0)return `${Q.seq} seguidas de primeira! 🔥`;
  return Q.tent===0?pick(["Mandou bem!","Isso aí!","Acertou de primeira!","Boa, treinadora!","Você está craque nessa!"]):pick(["Conseguiu! Errar faz parte de aprender.","Isso! Agora você já sabe essa."]);
}
const erroMsg=()=>pick(["Quase! Vamos ver como chegar nessa resposta.","Sem problema, errar ajuda a aprender.","Calma, você consegue! Olha a explicação.","Boa tentativa! Vamos de novo."]);
function msgFim(q){const t=q.f.length,c=q.certas;return c>=t-1?"Uau! Quase perfeito, você está dominando!":c>=t*0.6?"Muito bem! A cada treino você fica mais rápida.":"Você está aprendendo a cada tentativa. Continue assim!"}
function opcoes(a,b){
  const c=a*b,n=S.cfg.dificuldade==="facil"?3:4;
  const m=embaralhar([...new Set([c+a,c-a,c+b,c-b,a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,a+b,c+10,c-10,c+1,c-1])].filter(x=>x>0&&x!==c)).slice(0,n-1);
  while(m.length<n-1){const x=c+1+Math.floor(Math.random()*20);if(x!==c&&!m.includes(x))m.push(x)}
  return embaralhar([c,...m]);
}
function dicaTexto(a,b){return `💡 ${a} × ${b} é o ${a} somado ${b} ${b===1?"vez":"vezes"}: ${Array(b).fill(a).join(" + ")}`}
function mostrarDica(){const [a,b]=Q.f[Q.i];$("#fb").innerHTML=`<p class="dica">${dicaTexto(a,b)}</p>`}
function perguntar(){
  const [a,b]=Q.f[Q.i],d=S.cfg.dificuldade,escolher=d!=="dificil";Q.tent=0;
  app.innerHTML=`<div class="info"><div class="topq"><span>${Q.i+1} de ${Q.f.length}</span><span id="tm">${Q.modo==="desafio"?"":"Sem pressa"}</span></div><div class="barra"><i style="width:${Q.i/Q.f.length*100}%"></i></div></div>
  <div class="bal"><button class="pet pq ${pulaPet?"pulo":""}" aria-label="Seu companheiro"><img src="${IMG(S.comp)}" alt=""></button><div class="fala" id="balao">${balao}</div></div>
  <div class="tela"><div class="conta">${a} × ${b}</div>
  ${escolher?`<div class="ops">${opcoes(a,b).map(o=>`<button class="op" data-v="${o}" onclick="responder(${o})">${o}</button>`).join("")}</div>`
   :`<input id="r" type="number" inputmode="numeric" autocomplete="off" aria-label="Sua resposta"><button class="grande" onclick="responder()">Responder</button>`}
  <div id="fb">${d==="facil"?`<p class="dica">${dicaTexto(a,b)}</p>`:`<button class="lin" onclick="mostrarDica()">Preciso de uma dica</button>`}</div></div>
  <button class="sec" onclick="ir('estudar')">Sair</button>`;
  pulaPet=false;
  if($("#r")){$("#r").focus();$("#r").onkeydown=e=>{if(e.key==="Enter")responder()}}
  if(Q.modo==="desafio")tick();
}
function conta(){
  const h=hoje();if(S.feitas.dia!==h)S.feitas={dia:h,n:0};S.feitas.n++;S.hist[h]=(S.hist[h]||0)+1;
  if(S.last!==h&&S.feitas.n>=S.cfg.meta){
    S.streak=(S.last&&dif(S.last,h)===1)?S.streak+1:1;if(S.streak===1)S.inicio=h;
    S.last=h;S.perdeu=false;S.coins+=S.cfg.bonusMeta;toast(`🔥 Foguinho aceso! ${S.streak} ${S.streak===1?"dia":"dias"} seguidos. +${S.cfg.bonusMeta} moedas`);
    if(S.streak%7===0&&S.legFor!==S.inicio+":"+S.streak){S.legFor=S.inicio+":"+S.streak;S.pendLeg=true}
  }
  save();
}
function responder(val){
  const [a,b]=Q.f[Q.i],v=val!==undefined?String(val):$("#r").value;if(v==="")return;
  if(Q.modo==="desafio"&&Date.now()>Q.fim)return fim(false,"O tempo acabou! Respire fundo e tente de novo.");
  if(+v===a*b){bip([660,880]);balao=acertoMsg();pulaPet=true;

    const ch=await(await fetch(sp.evolution_chain.url)).json();
    const achar=n=>idDe(n.species.url)===id?n:n.evolves_to.map(achar).find(Boolean);
    const ops=(achar(ch.chain)?.evolves_to||[]).map(x=>{
      const d=x.evolution_details[0]||{},alvo=idDe(x.species.url),t=d.trigger?.name;
      if(t==="level-up"&&d.min_level)return[alvo,d.min_level];
      if(t==="level-up"&&d.min_happiness)return[alvo,"amizade"];
      if(t==="use-item"&&PTI[d.item?.name])return[alvo,PTI[d.item.name]];
      if(t==="trade")return[alvo,"troca"];
      return[alvo,"especial"];
    });
    const e=ops.find(o=>o[1]!=="especial")||ops[0]||false;
    EVO[id]=e;S.evo=S.evo||{};S.evo[id]=e;save();return true;
  }catch{delete EVOX[id];return false}
}
function garantirEvo(){if(S.comp)carregarEvo(S.comp).then(n=>{if(n&&tela==="inicio")render()})}
async function sortear(rar){
  if(rar==="lendario")return{id:LEND[Math.floor(Math.random()*LEND.length)],rar};
  for(let i=0;i<8;i++){
    const id=1+Math.floor(Math.random()*1025);
    try{
      const sp=await(await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`)).json();
      if(sp.is_legendary||sp.is_mythical||sp.evolves_from_species)continue;
      return{id,rar:sp.capture_rate>=120?"comum":"raro"};
    }catch{break}
  }
  const r=Math.random()<.8?"comum":"raro";return{id:POOL[r][Math.floor(Math.random()*POOL[r].length)],rar:r};
}
function motivoSemCaptura(t){
  const h=hoje(),n=S.cap.dia===h?S.cap.n:0;
  if(n>=S.cfg.capDia)return `Você já capturou ${n} Pokémon hoje.`;
  const u=S.cap.tab[t];
  if(u&&dif(u,h)<S.cfg.capSemana)return `A tabuada do ${t} já rendeu um Pokémon nos últimos ${S.cfg.capSemana} dias.`;
  return "";
}

/* ---------- área do professor: senha, gráficos e backup ---------- */
let profOk=false;
const TZS=["America/Fortaleza","America/Sao_Paulo","America/Manaus","America/Belem","America/Recife","America/Bahia","America/Cuiaba","America/Campo_Grande","America/Rio_Branco","America/Noronha"];
function telaPin(){return `<h2>Área do professor</h2><div class="info"><label>Digite a senha<input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" onkeydown="if(event.key==='Enter')entrarPin()"></label><button class="sec" onclick="entrarPin()">Entrar</button><p id="pinmsg"></p></div>`}
function entrarPin(){if($("#pin").value===S.cfg.pin){profOk=true;render()}else{$("#pinmsg").textContent="Senha incorreta.";$("#pin").value=""}}
function setPin(v){v=v.trim();if(v&&!/^\d{4,6}$/.test(v)){toast("A senha precisa ter de 4 a 6 números.");return render()}S.cfg.pin=v;save();toast(v?"Senha salva.":"Senha removida.")}
function dias(n){return [...Array(n)].map((_,i)=>{const t=new Date(Date.now()-(n-1-i)*864e5);try{return t.toLocaleDateString("sv-SE",{timeZone:S.cfg.tz})}catch{return t.toLocaleDateString("sv-SE")}})}
function grafico(vals,rot,max,cor,suf){
  const w=300/vals.length;
  return `<svg viewBox="0 0 300 120" role="img" style="width:100%;background:rgba(0,0,0,.22);border-radius:10px">${vals.map((v,i)=>{const h=v==null?0:Math.max(2,v/max*75);
    return `<rect x="${i*w+3}" y="${95-h}" width="${w-6}" height="${h}" rx="3" fill="${cor}"/><text x="${i*w+w/2}" y="${v==null?92:91-h}" font-size="8" fill="#fff" text-anchor="middle">${v==null?"":Math.round(v)+suf}</text>${i%2===0?`<text x="${i*w+w/2}" y="112" font-size="8" fill="#fff" text-anchor="middle">${rot[i]}</text>`:""}`}).join("")}</svg>`;
}
function porTabuada(){const r={};for(const [k,v] of Object.entries(S.stats)){const [a,b]=k.split("x").map(Number);for(const n of new Set([a,b])){const x=r[n]||(r[n]={ok:0,err:0});x.ok+=v.ok;x.err+=v.err}}return r}
function graficosProf(){
  const ds=dias(14),rot=ds.map(d=>d.slice(8)+"/"+d.slice(5,7));
  const pct=ds.map(d=>{const x=S.hist2?.[d];return x&&x.ok+x.err?x.ok/(x.ok+x.err)*100:null});
  const qtd=ds.map(d=>S.hist[d]||0),mx=Math.max(10,...qtd),pt=porTabuada();
  const linhas=Object.keys(pt).map(Number).sort((a,b)=>a-b).map(n=>{const x=pt[n],t=x.ok+x.err,p=Math.round(x.ok/t*100);return `<div class="stat"><span>Tabuada do ${n}</span><div class="barra"><i style="width:${p}%"></i></div><b>${p}% (${t})</b></div>`}).join("");
  return `<p><b>Acertos de primeira por dia (últimos 14 dias)</b></p>${grafico(pct,rot,100,"#ffcb05","%")}<p><b>Contas respondidas por dia</b></p>${grafico(qtd,rot,mx,"#7fb8ff","")}<p><b>Acerto de primeira por tabuada</b> (entre parênteses, as contas tentadas)</p>${linhas||"<p>Ainda sem dados.</p>"}`;
}
const backupTexto=()=>JSON.stringify({app:"tabuada-pokemon",versao:1,data:new Date().toISOString(),estado:S});
function exportar(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([backupTexto()],{type:"application/json"}));a.download=`backup-tabuada-${hoje()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("Backup baixado.")}
function copiarBackup(){try{navigator.clipboard.writeText(backupTexto()).then(()=>toast("Backup copiado! Cole em um lugar seguro."),()=>toast("Não consegui copiar. Use Baixar backup."))}catch{toast("Não consegui copiar. Use Baixar backup.")}}
function aplicar(txt){
  try{const j=JSON.parse(txt),e=j.estado;
    if(j.app!=="tabuada-pokemon"||!e||typeof e.coins!=="number"||typeof e.caught!=="object"||typeof e.cfg!=="object")throw 0;
    if(!confirm("Isso vai substituir o progresso atual por este backup. Continuar?"))return;
    localStorage.setItem(KEY,JSON.stringify(e));location.reload();
  }catch{toast("Esse conteúdo não parece um backup válido.")}
}
function importar(f){if(f)f.text().then(aplicar)}

/* ---------- pokédex ---------- */
function dex(){
  const [a,b]=GERS[gerAtual-1],total=Object.keys(S.caught).length,tem=Object.keys(S.caught).filter(i=>i>=a&&i<=b).length;
  let h=`<h2>Pokédex: ${total} de 1025</h2><select onchange="gerAtual=+this.value;render()">${GERS.map((g,i)=>`<option value="${i+1}" ${gerAtual===i+1?"selected":""}>Geração ${i+1} (nº ${g[0]} a ${g[1]})</option>`).join("")}</select>
  <label><input type="checkbox" style="width:auto" ${soTem?"checked":""} onchange="soTem=this.checked;render()"> Mostrar só os conquistados</label><p>Nesta geração: ${tem} de ${b-a+1}</p><div class="grade">`;
  for(let i=a;i<=b;i++){const c=S.caught[i];if(soTem&&!c)continue;
    h+=`<div class="card ${c?"":"bloq"}"><img loading="lazy" src="${IMG(i)}" alt=""><span>${c?c.nome:"nº "+i}</span>${c?`<small>Nível ${c.nivel||1}</small> `+(S.comp==i?"<small>Companheiro</small>":`<button class="mini" onclick="comp(${i})">Escolher</button>`):""}</div>`}
  return h+"</div>";
}

/* ---------- professor ---------- */
function setc(k,v){S.cfg[k]=v;save();if(k==="reduzir")document.body.classList.toggle("reduzir",v)}
function prof(){if(S.cfg.pin&&!profOk)return telaPin();
  const c=S.cfg,erros=Object.entries(S.stats).filter(([,v])=>v.err).sort((a,b)=>b[1].err-a[1].err).slice(0,6);
  const tot=Object.values(S.stats).reduce((s,v)=>({ok:s.ok+v.ok,err:s.err+v.err}),{ok:0,err:0});
  const dias=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-i*864e5).toLocaleDateString("sv-SE",{timeZone:c.tz});return[d.slice(5).split("-").reverse().join("/"),S.hist[d.slice(0,10)]||S.hist[d]||0]}).reverse();
  return `<h2>Acompanhamento</h2><div class="info"><p>Acertos de primeira: ${tot.ok} · Erros: ${tot.err}</p>
  <p><b>Contas com mais erros:</b> ${erros.length?erros.map(([k,v])=>k.replace("x"," × ")+` (${v.err})`).join(", "):"nenhuma ainda"}</p>
  ${graficosProf()}</div>${S.cfg.pin?"":`<p class="aviso">Dica: crie uma senha em Ajustes para a aluna não mudar as configurações.</p>`}
  <h2>Ajustes</h2><div class="info">
  <label>Tempo do desafio (segundos)<input type="number" min="10" value="${c.tempo}" onchange="setc('tempo',+this.value)"></label>
  <label>Meta diária (contas)<input type="number" min="3" value="${c.meta}" onchange="setc('meta',+this.value)"></label>
  <label>Tabuadas até<select onchange="setc('max',+this.value)"><option ${c.max===10?"selected":""}>10</option><option ${c.max===12?"selected":""}>12</option></select></label>
  <label>Limite de moedas por dia pelos acertos<input type="number" min="0" value="${c.teto}" onchange="setc('teto',+this.value)"></label>
  <label>Limite de XP por dia pelos acertos<input type="number" min="0" value="${c.tetoXP}" onchange="setc('tetoXP',+this.value)"></label>
  <label>Dificuldade das perguntas<select onchange="setc('dificuldade',this.value)">
    <option value="facil" ${c.dificuldade==="facil"?"selected":""}>Fácil: escolher entre 3 opções, com dica</option>
    <option value="medio" ${c.dificuldade==="medio"?"selected":""}>Médio: escolher entre 4 opções, dica sob pedido</option>
    <option value="dificil" ${c.dificuldade==="dificil"?"selected":""}>Difícil: digitar a resposta</option></select></label>
  <label>Moedas por acerto de primeira<input type="number" min="0" value="${c.moedaAcerto}" onchange="setc('moedaAcerto',+this.value)"></label>
  <label>Bônus por cumprir a meta do dia<input type="number" min="0" value="${c.bonusMeta}" onchange="setc('bonusMeta',+this.value)"></label>
  <label>Bônus do desafio diário<input type="number" min="0" value="${c.bonusDiario}" onchange="setc('bonusDiario',+this.value)"></label>
  <label>Moedas por Pokémon repetido (ou captura já feita)<input type="number" min="0" value="${c.bonusRepet}" onchange="setc('bonusRepet',+this.value)"></label>
  <label>Capturas por dia (máximo)<input type="number" min="1" value="${c.capDia}" onchange="setc('capDia',+this.value)"></label>
  <label>Dias para a mesma tabuada capturar de novo<input type="number" min="1" value="${c.capSemana}" onchange="setc('capSemana',+this.value)"></label>
  <label>Fuso horário<select onchange="setc('tz',this.value);render()">${[...new Set([c.tz,...TZS])].map(z=>`<option ${z===c.tz?"selected":""}>${z}</option>`).join("")}</select></label>
  <label><input type="checkbox" style="width:auto" ${c.reduzir?"checked":""} onchange="setc('reduzir',this.checked)"> Reduzir movimento (o app também segue a configuração do celular)</label>
  <label><input type="checkbox" style="width:auto" ${c.som?"checked":""} onchange="setc('som',this.checked)"> Sons ligados</label>
  <label><input type="checkbox" style="width:auto" ${c.lembrete?"checked":""} onchange="setc('lembrete',this.checked)"> Lembrete diário</label>
  <label>Horário do lembrete<input type="time" value="${c.hora}" onchange="setc('hora',this.value)"></label>
  <button class="sec" onclick="pedirNotif()">Permitir notificações</button>
  <label>Senha da área do professor (4 a 6 números; vazio = sem senha)<input type="password" inputmode="numeric" maxlength="6" value="${c.pin||""}" onchange="setPin(this.value)"></label>
  <h2>Backup do progresso</h2>
  <p class="aviso">O progresso fica salvo <b>somente neste aparelho e neste navegador</b>, neste endereço. Se os dados do navegador forem limpos ou se trocar de celular, ele se perde. Faça um backup de vez em quando.</p>
  <button class="sec" onclick="exportar()">Baixar backup</button> <button class="sec" onclick="copiarBackup()">Copiar backup</button>
  <label>Restaurar de um arquivo<input type="file" accept=".json,application/json" onchange="importar(this.files[0])"></label>
  <label>Ou cole o texto do backup aqui<textarea id="colar" rows="3" style="width:100%;border:0;border-radius:10px;padding:8px"></textarea></label>
  <button class="sec" onclick="aplicar($('#colar').value)">Restaurar do texto</button>
  <button class="sec" onclick="if(confirm('Apagar todo o progresso?')){localStorage.removeItem(KEY);location.reload()}">Apagar progresso</button></div>`;
}

if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
